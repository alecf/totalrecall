version: 2

updates:
  # Swift Package Manager — Sparkle ships inside the app bundle, so these
  # bumps use `build:` and stay visible in the release changelog.
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      swift:
        patterns: ["*"]
        update-types: [minor, patch]

  # Marketing site (React + Vite). Dev-only churn, kept out of the changelog
  # with `chore:` — cliff.toml skips that type.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      prefix-development: chore
    groups:
      site:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 (the Go port) is outside every published
      # typescript-eslint peer range — the newest, 8.67.0, still caps at
      # `<6.1.0`. Bumping it makes `npm ci` unresolvable, which broke the
      # Pages deploy for two days. Drop this ignore once typescript-eslint
      # ships a release that accepts TypeScript 7.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # Workflow actions are pinned to commit SHAs; Dependabot rewrites both the
  # SHA and its trailing `# vN` comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
