name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build all targets
        run: swift build

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build --show-bin-path)"
          XCTEST_BUNDLE="$(find "$BIN_DIR" -maxdepth 1 -name '*.xctest')"
          BIN="$XCTEST_BUNDLE/Contents/MacOS/$(basename "$XCTEST_BUNDLE" .xctest)"
          PROFDATA="$BIN_DIR/codecov/default.profdata"

          xcrun llvm-cov report "$BIN" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|TotalRecallTests|Sparkle' \
            > coverage-report.txt
          cat coverage-report.txt

          TOTAL_LINE="$(grep '^TOTAL' coverage-report.txt)"
          # Columns: Regions.. Functions.. Lines Cover% Branches Missed Cover%
          # Lines coverage is the 4th-from-last field regardless of whether
          # branch columns ("-" when no branch data) are present.
          LINE_COVERAGE="$(echo "$TOTAL_LINE" | awk '{print $(NF-3)}')"

          {
            echo "## Test Coverage: ${LINE_COVERAGE}"
            echo
            echo '<details><summary>Per-file report</summary>'
            echo
            echo '```'
            cat coverage-report.txt
            echo '```'
            echo '</details>'
          } > coverage-comment.md

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        with:
          header: coverage
          path: coverage-comment.md

      - name: Build release
        run: swift build -c release
