name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  # Mirrors the build half of deploy-site.yml step for step. Without this,
  # nothing installs the site's npm tree until a push to main, so a bad
  # dependency bump merges green and only fails once it is already on main
  # and the deploy is the thing running it. Keep the Node setup and the
  # `npm ci` here identical to deploy-site.yml — if the two drift, this job
  # stops predicting whether the deploy will succeed.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `npm ci` — never `npm install`. It installs the lockfile exactly and
      # re-checks peer ranges, which is precisely the failure mode this job
      # exists to catch. A local `npm run build` against a stale node_modules
      # will happily pass while the lockfile is unsatisfiable.
      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Lint
        working-directory: site
        run: npm run lint

      - name: Build
        working-directory: site
        run: npm run build

  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Show environment
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build all targets
        run: swift build

      - name: Run tests with coverage
        run: swift test --enable-code-coverage

      - name: Generate coverage report
        run: |
          set -euo pipefail
          BIN_DIR="$(swift build --show-bin-path)"
          XCTEST_BUNDLE="$(find "$BIN_DIR" -maxdepth 1 -name '*.xctest')"
          BIN="$XCTEST_BUNDLE/Contents/MacOS/$(basename "$XCTEST_BUNDLE" .xctest)"
          PROFDATA="$BIN_DIR/codecov/default.profdata"

          xcrun llvm-cov report "$BIN" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|TotalRecallTests|Sparkle' \
            | tee coverage-report.txt

          xcrun llvm-cov export "$BIN" \
            -instr-profile "$PROFDATA" \
            -ignore-filename-regex='\.build|TotalRecallTests|Sparkle' \
            -path-equivalence="$(pwd)",. \
            -format=lcov > lcov.info

      - name: Upload lcov for main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-lcov
          path: lcov.info
          retention-days: 14

      - name: Download lcov from main
        if: github.event_name == 'pull_request'
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: ci.yml
          branch: main
          name: main-lcov
          path: main-lcov
          if_no_artifact_found: ignore

      - name: Check for base lcov
        id: base_lcov
        if: github.event_name == 'pull_request'
        run: |
          if [ -f main-lcov/lcov.info ]; then
            echo "path=main-lcov/lcov.info" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      # Dependabot PRs get a read-only GITHUB_TOKEN regardless of the
      # `permissions:` block above, so posting a comment would 403 and fail
      # the job. Coverage still runs and prints to the log for those PRs.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        uses: romeovs/lcov-reporter-action@87a815f34ec27a5826abba44ce09bbc688da58fd # v0.4.0
        with:
          lcov-file: lcov.info
          lcov-base: ${{ steps.base_lcov.outputs.path }}
          filter-changed-files: true
          delete-old-comments: true
          title: Test Coverage

      - name: Build release
        run: swift build -c release
