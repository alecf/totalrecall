name: PR Screenshot

# SECURITY: this workflow builds and RUNS untrusted fork PR code (swift build
# executes the fork's Package.swift/plugins; --screenshot runs the compiled
# binary). It therefore runs as a plain `pull_request` event with NO write
# permissions and NO access to secrets. The privileged half — uploading the
# screenshot and editing the PR description — lives in pr-screenshot-publish.yml,
# which runs from trusted `main` via workflow_run. Do NOT switch this to
# pull_request_target and do NOT add write permissions here: either change would
# hand a write-scoped token to attacker-controlled code.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-screenshot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  screenshot:
    runs-on: macos-26
    # Hard cap so a hung `--screenshot` invocation can't burn 6 hours of CI.
    # The app's own AppDelegate backstop fires at ~25s and the background-app
    # launch is capped separately below, so this is headroom for a cold-runner
    # build rather than a deadline any healthy run should approach.
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Build app (release)
        # Don't pass --target TotalRecall here — SwiftPM compiles the
        # module but skips linking the executable in that mode (likely a
        # quirk with binary-framework deps like Sparkle). A bare
        # `swift build -c release` actually links the binary.
        run: swift build -c release

      - name: Open background apps for realistic process list
        # Purely cosmetic — these give the river bar something interesting to
        # render beyond system processes. It must never be able to stall or
        # fail the job: a screenshot with a thin process list beats no
        # screenshot at all. Hence the step cap and continue-on-error.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          set +e

          # `open` blocks until LaunchServices acknowledges the launch. On
          # macos-26 images from 20260720 onward that handshake can hang
          # indefinitely — this step sat silent for 4 minutes until the job
          # timeout killed it, and the runner image is the only thing that
          # changed between the last green run (image 20260610, 1m15s) and
          # the first hang (image 20260720). Same macOS build either way.
          #
          # So: run `open` in the background and abandon the handshake rather
          # than waiting on it. stdio goes to /dev/null so a launched GUI app
          # cannot inherit and hold this step's output pipe open — the runner
          # waits for that pipe to reach EOF before marking a step complete,
          # which is a second, independent way this step could hang.
          launch() {
            app="$1"
            shift
            open -a "$app" "$@" >/dev/null 2>&1 </dev/null &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 20 ]; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              echo "$app: 'open' still blocked after ${waited}s — abandoning the handshake"
              # disown before killing so bash doesn't print a "Killed: 9" job
              # notice that reads like a build failure in the CI log.
              disown "$pid" 2>/dev/null
              kill -9 "$pid" 2>/dev/null
            else
              echo "$app: 'open' returned after ${waited}s"
            fi
          }

          # Chrome's --no-first-run / --no-default-browser-check suppress the
          # Welcome and "Set as default" dialogs that otherwise pop up over
          # the TotalRecall window on a fresh profile.
          launch Safari
          launch "Google Chrome" --args --no-first-run --no-default-browser-check

          # Let them allocate memory and settle.
          sleep 6

          # Breadcrumbs: whether the apps actually came up, and which of the
          # two hang mechanisms above we hit, so a future regression is
          # diagnosable from the log alone.
          echo "Safari processes: $(pgrep -c -f Safari || echo 0)"
          echo "Chrome processes: $(pgrep -c -f 'Google Chrome' || echo 0)"
          exit 0

      - name: Capture screenshot
        env:
          OUT: ${{ github.workspace }}/screenshot.png
        run: |
          set -euo pipefail
          # SwiftPM puts release binaries under an arch-prefixed path
          # (e.g. .build/arm64-apple-macosx/release) on Apple Silicon —
          # ask swift where the bin dir actually is rather than hardcoding.
          BIN="$(swift build -c release --show-bin-path)/TotalRecall"
          echo "Running: $BIN --screenshot $OUT"
          "$BIN" --screenshot "$OUT"
          # The app waits ~8s for its first refresh cycle and then quits itself.
          ls -la "$OUT"
          file "$OUT"

      - name: Record PR metadata
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Persist the screenshot plus the PR number and head SHA so the
          # privileged follow-up workflow knows which PR to update. These two
          # values come from the trusted `pull_request` event context, NOT from
          # the checked-out fork code — an attacker cannot forge another PR's
          # number here. The publish workflow re-validates them regardless.
          mkdir -p pr-meta
          cp "$GITHUB_WORKSPACE/screenshot.png" pr-meta/screenshot.png
          printf '%s\n' "$PR" > pr-meta/number
          printf '%s\n' "$HEAD_SHA" > pr-meta/head_sha

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-screenshot
          path: pr-meta/
          retention-days: 1
