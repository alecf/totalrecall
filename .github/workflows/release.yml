name: Release

# Phase 1 of 2. Running this workflow does NOT publish anything to users or
# commit to main. It builds + signs the DMG, creates a DRAFT GitHub Release
# holding it, and opens a pull request that adds the new appcast.xml entry.
# Merging that PR runs release-publish.yml, which flips the draft to published
# and (via the appcast landing on main) takes the Sparkle update feed live.
# Nothing reaches main or users without a reviewed, merged PR.
#
# The appcast PR is opened by a GitHub App installation token, not the default
# GITHUB_TOKEN. GitHub suppresses workflow runs for events created by
# GITHUB_TOKEN (recursion protection), so a PR opened with it gets no CI at all
# and the required checks sit unfilled until a human pushes an empty commit or
# closes and reopens it. An app token is a distinct identity, so ci.yml,
# pr-title.yml and pr-screenshot.yml all fire the moment the PR opens — which is
# also what makes auto-merge viable. See docs/sparkle-setup.md for app setup.

on:
  workflow_dispatch:

permissions:
  contents: write  # create the draft release (the app token pushes + opens the PR)

jobs:
  prepare:
    runs-on: macos-26
    steps:
      # Minted first so a missing/expired app credential fails in seconds rather
      # than after a full build-sign-package cycle.
      - name: Verify release app credentials are configured
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Missing RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY secrets. See docs/sparkle-setup.md."
            exit 1
          fi

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          # Persisted as the push credential for the release/* branch below, so
          # the branch and PR carry the app's identity.
          token: ${{ steps.app-token.outputs.token }}

      - name: Select Xcode 26.4
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Install git-cliff
        run: brew install git-cliff

      - name: Calculate version and changelog
        id: ver
        run: |
          VERSION=$(git-cliff --bumped-version 2>/dev/null)
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::git-cliff could not calculate a version"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "TAG=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

          # Generate changelog for this release
          CHANGELOG=$(git-cliff --latest --strip header 2>/dev/null)
          # Write multiline output using delimiter
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGELOG<<${EOF}" >> "$GITHUB_OUTPUT"
          echo "${CHANGELOG}" >> "$GITHUB_OUTPUT"
          echo "${EOF}" >> "$GITHUB_OUTPUT"

          # Same commits, same grouping (both runs use cliff.toml) — only the
          # body template differs. Sparkle shows release notes in a web view,
          # so the appcast needs HTML where the GitHub Release wants markdown.
          git-cliff --latest --strip header \
            --body "$(cat .github/appcast-body.tera)" > appcast-notes.html
          if [ ! -s appcast-notes.html ]; then
            echo "::error::git-cliff produced empty appcast release notes"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Build release binary
        run: swift build -c release --product TotalRecall

      - name: Verify Sparkle private key is configured
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::Missing SPARKLE_PRIVATE_KEY secret. Run generate_keys locally and set the exported private key as a repo secret. See docs/sparkle-setup.md."
            exit 1
          fi

      - name: Assemble app bundle
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          APP="Total Recall.app"
          mkdir -p "${APP}/Contents/MacOS"
          mkdir -p "${APP}/Contents/Resources"
          cp .build/release/TotalRecall "${APP}/Contents/MacOS/"

          # SwiftPM only sets @loader_path as the binary's rpath, which points
          # at Contents/MacOS — but Sparkle.framework lives in Contents/Frameworks
          # in a standard .app layout. Add the bundle rpath so dyld can find it.
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
            "${APP}/Contents/MacOS/TotalRecall"

          # Stamp the version into the committed Info.plist. The Sparkle public
          # key is already inlined there, so no further substitution is needed.
          sed "s/VERSION_PLACEHOLDER/${VERSION}/g" \
            Distribution/Info.plist > "${APP}/Contents/Info.plist"

          # App icon. Committed as a built .icns so the release runner doesn't
          # need librsvg; regenerate with Distribution/make-icon.sh after
          # editing Distribution/AppIcon.svg.
          cp Distribution/AppIcon.icns "${APP}/Contents/Resources/"

          # Bundle the Sparkle.framework that SwiftPM resolved into Frameworks/
          # so the app can launch without depending on the build cache.
          FRAMEWORK_SRC=$(find .build -path "*Sparkle.framework" -type d -print -quit)
          if [ -z "$FRAMEWORK_SRC" ]; then
            echo "::error::Could not locate Sparkle.framework in build output"
            exit 1
          fi
          mkdir -p "${APP}/Contents/Frameworks"
          cp -R "$FRAMEWORK_SRC" "${APP}/Contents/Frameworks/"

      - name: Ad-hoc sign app bundle
        run: |
          APP="Total Recall.app"
          codesign --force --deep --sign - --timestamp=none "${APP}"
          codesign --verify --verbose "${APP}"
          spctl --assess --type execute --verbose "${APP}" || true

      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          mkdir -p dmg-staging
          cp -R "Total Recall.app" dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create \
            -volname "Total Recall" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            "TotalRecall-${VERSION}-arm64.dmg"

      - name: Sign DMG with Sparkle EdDSA
        id: sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.ver.outputs.VERSION }}"
          DMG="TotalRecall-${VERSION}-arm64.dmg"

          # Install Sparkle CLI tools (sign_update lives in bin/)
          SPARKLE_VERSION="2.6.4"
          curl -sSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p sparkle-tools
          tar -xf sparkle.tar.xz -C sparkle-tools

          # sign_update emits the appcast attribute fragment to stdout, e.g.:
          #   sparkle:edSignature="abc..." length="12345678"
          # We capture it verbatim and pass it through to the appcast updater.
          SIG_FRAGMENT=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | ./sparkle-tools/bin/sign_update --ed-key-file - "$DMG")
          echo "Signature fragment: $SIG_FRAGMENT"
          echo "SIG_FRAGMENT=$SIG_FRAGMENT" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
          TAG: ${{ steps.ver.outputs.TAG }}
          CHANGELOG: ${{ steps.ver.outputs.CHANGELOG }}
        run: |
          set -euo pipefail
          DMG="TotalRecall-${VERSION}-arm64.dmg"

          # Draft + no tag yet: nothing is public and no git tag exists until
          # release-publish.yml flips this to published when the appcast PR
          # merges. Re-dispatching for the same version replaces the old draft.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          printf '%s' "$CHANGELOG" > release-notes.md
          gh release create "$TAG" \
            --draft \
            --target main \
            --title "Total Recall ${VERSION}" \
            --notes-file release-notes.md \
            "$DMG"

      - name: Update appcast.xml
        env:
          SIG_FRAGMENT: ${{ steps.sparkle.outputs.SIG_FRAGMENT }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
          TAG: ${{ steps.ver.outputs.TAG }}
          REPO: ${{ github.repository }}
        run: |
          # The download URL becomes valid once release-publish.yml publishes
          # the draft (which creates the tag). Until then the appcast lives only
          # on the release/* branch, not on main.
          python3 .github/scripts/update_appcast.py \
            --appcast site/public/appcast.xml \
            --version "$VERSION" \
            --tag "$TAG" \
            --signature-fragment "$SIG_FRAGMENT" \
            --download-url "https://github.com/${REPO}/releases/download/${TAG}/TotalRecall-${VERSION}-arm64.dmg" \
            --notes-file appcast-notes.html

      - name: Open appcast pull request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -euo pipefail
          BRANCH="release/${TAG}"

          # Attribute the commit to the app's bot user. GitHub links a commit to
          # that account only when the noreply address carries its numeric id,
          # which isn't in the token output — look it up from the slug.
          APP_USER_ID=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add site/public/appcast.xml
          if git diff --staged --quiet; then
            echo "::error::No appcast changes to commit"
            exit 1
          fi
          git commit -m "chore(release): publish appcast for ${TAG}"
          # Force-push so a re-dispatch for the same version refreshes the branch.
          git push --force origin "$BRANCH"

          # Scoped to open PRs on purpose: `gh pr view <branch>` also resolves a
          # PR that was closed to abort an earlier attempt, and reusing that
          # would leave the re-dispatch with nothing mergeable.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "PR for $BRANCH already open; updated by the force-push above."
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "chore(release): ${TAG}" \
              --body "$(cat <<EOF
          Publishes **Total Recall ${VERSION}**.

          Merging this PR:
          - lands the new \`appcast.xml\` entry on \`main\`, and
          - triggers \`release-publish.yml\`, which flips the draft GitHub Release for \`${TAG}\` to published and creates the tag.

          The signed DMG is already attached to the draft release. **Nothing is public until this merges.**

          > [!NOTE]
          > Auto-merge is enabled: this merges itself once the required checks pass. To stop it, disable auto-merge on this PR or close it.
          EOF
          )"
          fi

      - name: Enable auto-merge
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.ver.outputs.TAG }}
        run: |
          set -uo pipefail
          BRANCH="release/${TAG}"

          # A PR GitHub still considers "clean" can't take an auto-merge request,
          # and it reads as clean for a few seconds after creation — until the
          # freshly-triggered required checks register as pending. Retry across
          # that window rather than dropping the release into manual merging.
          for attempt in 1 2 3 4 5 6; do
            if gh pr merge "$BRANCH" --auto --squash; then
              echo "Auto-merge enabled for $BRANCH"
              exit 0
            fi
            echo "Auto-merge not accepted yet (attempt ${attempt}/6); waiting for checks to register."
            sleep 10
          done

          echo "::warning::Could not enable auto-merge on ${BRANCH}. Check that 'Allow auto-merge' is on in repository settings and that main requires at least one status check. Merge the PR by hand once it is green."
